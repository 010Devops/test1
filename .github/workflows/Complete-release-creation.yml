name: Auto-Release Creation with commit history

on:
  workflow_dispatch:

jobs:      
  Release-Creation:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      GH_TOKEN: ${{ github.token }}
      
    steps: 
    - name: Checkout
      # actions/checkout@v7
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    # To get the latest release name stored in the repository for the base branch
    - name: Get Dev Latest Release
      id: latest_release
      run: |
        token="$GH_TOKEN"
        branch_name="${{ github.ref_name }}"
        page=1
        latest_release=""
        while : ; do
          response=$(curl -s -H "Authorization: Bearer $token" "https://api.github.com/repos/${{ github.repository }}/releases?page=$page")
          echo "Response: $response"
          releases=$(echo "$response" | jq -r --arg branch_name "$branch_name" 'map(select(.name | test($branch_name; "i")))')        
          if [ "$(echo "$releases" | jq -e 'length')" -eq 0 ]  && [ "$(echo "$response" | jq -e 'length')" -eq 0 ] || [ "$(echo "$releases" | jq -e 'length')" -gt 0 ]; then
            latest_release=$(echo "$releases" | jq -r 'max_by(.published_at) | .tag_name')
            break
          fi
          
          ((page++))
        done
        echo "latest_release=$latest_release" >> $GITHUB_OUTPUT
      shell: bash

    - name: Set up Node.js
      # actions/setup-node@v7 
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 
      with:
        node-version: ${{ vars.NODE_VERSION }}
    
    # Installing required dependencies to run the NodeJS script
    - name: Install Dependencies
      run: npm install web-streams-polyfill @actions/core axios --force    
          
    # To get the PR data and make it as a description for PR and release
    - name: Release Description Data
      id: release_description
      # actions/github-script@v9
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      env:
        GITHUB_TOKEN : ${{ github.token }}
      with:          
        github-token: ${{ github.token }}
        script: | 
          // Initialize the packages
          require('web-streams-polyfill');

          const mycore = require('@actions/core');
          const axios = require('axios');

          // Get the token from the environment variable
          const token = process.env.GITHUB_TOKEN;

          const BASE = "${{ steps.latest_release.outputs.latest_release }}";
          const HEAD = "${{ github.ref_name }}";

          // Fetch commit history using the GitHub Compare API
          async function fetchCommitHistory() {
            let commitHistory = [];

            const commitsPerPage = 100;

            // To fetch the whole commits in current page using API and modify it into a required format
            async function fetchCurrentPageCommits(page) {
              const response = await axios.get(
                `https://api.github.com/repos/${{github.repository}}/compare/${BASE}...${HEAD}?page=${page}&per_page=${commitsPerPage}`,
                {
                  headers: {
                    Authorization: `Bearer ${token}`,
                    Accept: 'application/vnd.github+json'
                  }
                }
              );

              return response.data.commits.map(commit => {
                const commitHash = commit.sha.substring(0, 7);
                const commitMessage = commit.commit.message;
                const commitUrl = commit.html_url;

                return `• [${commitHash}](${commitUrl}) - ${commitMessage}`;
              });
            }

            let page = 1;
            let nextPageCommits = await fetchCurrentPageCommits(page);

            while (nextPageCommits.length > 0) {
              commitHistory = commitHistory.concat(nextPageCommits);

              page++;
              nextPageCommits = await fetchCurrentPageCommits(page);
            }

            const releaseDescription =
              `**Enhancements & Bug fixes:**\n\n${commitHistory.join('\n')}`;

            mycore.setOutput('releaseDescription', releaseDescription);
          }

          // Fetch the latest release name
          let latestRelease = "${{ steps.latest_release.outputs.latest_release }}";

          // Extract the version part
          const versionMatch = latestRelease.match(/\d+(\.\d+)+/);

          if (!versionMatch) {
            mycore.setFailed(
              `Unable to extract version from release name: ${latestRelease}`
            );
          } else {
            const versionString = versionMatch[0];

            const version = versionString
              .split('.')
              .map(part => parseInt(part, 10) || 0);

            let versionFirstPart = version[version.length - 3];
            let versionSecondPart = version[version.length - 2];
            let versionThirdPart = version[version.length - 1];

            if (versionThirdPart < 9) {
              versionThirdPart++;
              version[version.length - 1] = versionThirdPart;
            } else if (versionSecondPart < 9) {
              versionSecondPart++;
              versionThirdPart = 0;

              version[version.length - 2] = versionSecondPart;
              version[version.length - 1] = versionThirdPart;
            } else {
              versionFirstPart++;
              versionSecondPart = 0;
              versionThirdPart = 0;

              version[version.length - 3] = versionFirstPart;
              version[version.length - 2] = versionSecondPart;
              version[version.length - 1] = versionThirdPart;
            }

            let releaseName = version.join('.');

            releaseName = latestRelease.replace(
              /\d+(\.\d+)+/,
              releaseName
            );

            mycore.setOutput('releaseName', releaseName);
          }

          // Wait for the asynchronous function to complete
          await fetchCommitHistory();

    # To create release with name and description      
    - name: Create Release
      id: create_release
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_NAME: ${{ steps.release_description.outputs.releaseName }}
        RELEASE_DESCRIPTION: ${{ steps.release_description.outputs.releaseDescription }}
      run: |
        gh release create "$RELEASE_NAME" \
          --target "${{ github.ref_name }}" \
          --title "$RELEASE_NAME" \
          --notes "$RELEASE_DESCRIPTION" \
          --latest
      shell: bash
