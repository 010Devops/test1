
name: Release Version Testing

on:
  workflow_dispatch:

jobs:
  Release-Creation:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Create or Update GitHub Release and Upload Test Asset
        env:
          RELEASE_NAME: "Release Testing"
          RELEASE_DESCRIPTION: "Release Testing..."
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          TAG_NAME="${TARGET_BRANCH}-v${GITHUB_RUN_NUMBER}"
          RELEASE_ASSET="release-test.txt"

          echo "Release testing - Run ${GITHUB_RUN_NUMBER}" > "$RELEASE_ASSET"

          # Check whether the release already exists
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then

            echo "Release $TAG_NAME already exists."
            echo "Updating the existing release asset."

            gh release upload "$TAG_NAME" \
              "$RELEASE_ASSET" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber

            echo "Existing release updated successfully."

          else

            echo "Release $TAG_NAME does not exist."
            echo "Creating a new GitHub release."

            gh release create "$TAG_NAME" \
              "$RELEASE_ASSET" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Release-$TAG_NAME" \
              --target "$TARGET_BRANCH" \
              --generate-notes

            echo "New release created successfully."

          fi
