
name: Release Version Testing

on:
  workflow_dispatch:

jobs:
  Release-Creation:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Create GitHub Release and Upload Test Asset
        env:
          RELEASE_NAME: "Release Testing"
          RELEASE_DESCRIPTION: "Release Testing..."
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          TAG_NAME="${TARGET_BRANCH}-v${GITHUB_RUN_NUMBER}"
          RELEASE_ASSET="release-test.txt"

          echo "Release testing - Run ${GITHUB_RUN_NUMBER}" > "$RELEASE_ASSET"

          gh release create "$TAG_NAME" \
            "$RELEASE_ASSET" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Release-$TAG_NAME" \
            --target "$TARGET_BRANCH" \
            --generate-notes

          echo "Release created successfully."
