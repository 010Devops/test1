name: Base Auto Release Creation with Commits

on:
  workflow_dispatch:

jobs:
  Release-Creation:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
    - name: Checkout
      # actions/checkout@v7
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    # Latest commit on the branch (single line, safe for GITHUB_OUTPUT)
    - name: Get Current Merge Details
      id: current_merge_details
      run: |
        current_merge_details=$(git log -1 --oneline)
        echo "current_merge_details=$current_merge_details" >> "$GITHUB_OUTPUT"
      shell: bash

    # Latest release whose name matches the current branch name
    - name: Get Latest Release
      id: latest_release
      env:
        GH_TOKEN: ${{ github.token }}
        BRANCH_NAME: ${{ github.ref_name }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        gh api --paginate "repos/${REPO}/releases?per_page=100" > all_releases.json
        latest_release=$(jq -s -r --arg branch_name "$BRANCH_NAME" '
          add // []
          | map(select((.name // "") | test($branch_name; "i")))
          | if length == 0 then "" else (max_by(.published_at) | .tag_name) end
        ' all_releases.json)
        if [ -z "$latest_release" ]; then
          echo "No existing release found matching branch '$BRANCH_NAME'" >&2
          exit 1
        fi
        echo "Latest release: $latest_release"
        echo "latest_release=$latest_release" >> "$GITHUB_OUTPUT"
      shell: bash

    # Build PR/release description and compute the next release name
    - name: Release Description Data
      id: release_description
      # actions/github-script@v9
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      env:
        CURRENT_MERGE_DETAILS: ${{ steps.current_merge_details.outputs.current_merge_details }}
        LATEST_RELEASE: ${{ steps.latest_release.outputs.latest_release }}
        BRANCH_NAME: ${{ github.ref_name }}
      with:
        github-token: ${{ github.token }}
        script: |
          const { owner, repo } = context.repo;
          const currentMergeDetails = process.env.CURRENT_MERGE_DETAILS || '';
          const latestRelease = process.env.LATEST_RELEASE || '';
          const branchName = (process.env.BRANCH_NAME || '').toLowerCase();

          // ---------- 1. Find the merged PR ----------
          let mergedPR;
          try {
            // Most reliable: PRs associated with the commit this run is on
            const { data: associated } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner, repo, commit_sha: context.sha,
            });
            mergedPR = associated.find(pr => pr.merged_at);
          } catch (error) {
            core.warning(`Could not look up PRs by commit: ${error.message}`);
          }

          if (!mergedPR) {
            // Fallback: most recently updated merged PR into this branch
            const { data: closedPRs } = await github.rest.pulls.list({
              owner, repo,
              state: 'closed',
              base: process.env.BRANCH_NAME,
              sort: 'updated',
              direction: 'desc',
              per_page: 20,
            });
            mergedPR = closedPRs.find(pr => pr.merged_at !== null);
          }

          if (!mergedPR) {
            core.setFailed('No merged pull request found for this branch');
            return;
          }
          const mergedPRNumber = mergedPR.number;
          core.info(`Using merged PR #${mergedPRNumber}`);

          // ---------- 2. Current merge details ----------
          const updatedDescriptionData = [];
          updatedDescriptionData.push(
            currentMergeDetails
              .split('\n')
              .filter(commit => commit.trim() !== '')
              .map(commit => {
                const indexOfSpace = commit.indexOf(' ');
                const commitHash = commit.substring(0, indexOfSpace);
                const commitMessage = commit.substring(indexOfSpace + 1);
                const commitUrl = `https://github.com/${owner}/${repo}/commit/${commitHash}`;
                return `• [${commitHash}](${commitUrl}) - ${commitMessage}`;
              })
              .join('\n')
          );

          // ---------- 3. Commit history of the PR (paginated) ----------
          const commits = await github.paginate(github.rest.pulls.listCommits, {
            owner, repo, pull_number: mergedPRNumber, per_page: 100,
          });
          const commitHistory = commits.map(commit => {
            const commitHash = commit.sha.substring(0, 7);
            return `• [${commitHash}](${commit.html_url}) - ${commit.commit.message}`;
          });

          updatedDescriptionData.push('\n\n**Commit History:**');
          commitHistory.forEach(line => {
            if (line.includes('Merge pull request #')) {
              const parts = line.split('\n');
              const commitInfo = parts[0];
              const remainingContent = parts.slice(1).join('\n').trim();
              updatedDescriptionData.push(`${commitInfo} - [ ${remainingContent} ]`);
            } else {
              updatedDescriptionData.push(line);
            }
          });

          // ---------- 4. Update the PR description ----------
          const { data: existingPullRequest } = await github.rest.pulls.get({
            owner, repo, pull_number: mergedPRNumber,
          });
          const existingPRDescription = existingPullRequest.body;

          const validBranches = ['main', 'master', 'prod', 'production'];
          let description;
          if (existingPRDescription == null) {
            description = `**Current Merge Details:**\n${updatedDescriptionData.join('\n')}`;
          } else if (validBranches.includes(branchName)) {
            description = `**Release Note:**\n${existingPRDescription}\n\n**Current Merge Details:**\n${updatedDescriptionData.join('\n')}`;
          } else {
            description = `**Description:**\n${existingPRDescription}\n\n**Current Merge Details:**\n${updatedDescriptionData.join('\n')}`;
          }

          await github.rest.pulls.update({
            owner, repo, pull_number: mergedPRNumber, body: description,
          });

          core.setOutput('releaseDescription', `**Enhancements & Bug fixes:**\n\n${description}`);

          // ---------- 5. Compute next release name ----------
          const match = latestRelease.match(/\d+(\.\d+)+/);
          if (!match) {
            core.setFailed(`Could not find a version number in latest release "${latestRelease}"`);
            return;
          }
          const version = match[0].split('.').map(part => parseInt(part, 10) || 0);
          const n = version.length;

          if (version[n - 1] < 9) {
            version[n - 1]++;
          } else if (version[n - 2] < 9) {
            version[n - 2]++;
            version[n - 1] = 0;
          } else {
            version[n - 3]++;
            version[n - 2] = 0;
            version[n - 1] = 0;
          }

          const releaseName = latestRelease.replace(/\d+(\.\d+)+/, version.join('.'));
          core.info(`Next release: ${releaseName}`);
          core.setOutput('releaseName', releaseName);

    # Create the release with name and description
    - name: Create Release
      id: create_release
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_NAME: ${{ steps.release_description.outputs.releaseName }}
        RELEASE_DESCRIPTION: ${{ steps.release_description.outputs.releaseDescription }}
        TARGET_BRANCH: ${{ github.ref_name }}
      run: |
        set -euo pipefail
        if [ -z "$RELEASE_NAME" ]; then
          echo "Release name is empty; aborting" >&2
          exit 1
        fi
        gh release create "$RELEASE_NAME" \
          --target "$TARGET_BRANCH" \
          --title "$RELEASE_NAME" \
          --notes "$RELEASE_DESCRIPTION" \
          --latest
      shell: bash
